{{- if and .Values.lapi.enabled .Values.lapi.ingress.enabled }}
{{- $ingress := .Values.lapi.ingress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "crowdsec.componentName" (list . "lapi") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crowdsec.labels" (list . "lapi") | nindent 4 }}
  {{- include "crowdsec.annotations" (dict "ctx" . "extra" $ingress.annotations) | nindent 2 }}
spec:
  {{- with $ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- with $ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "crowdsec.componentName" (list . "lapi") }}
                port:
                  name: lapi
{{- end }}
