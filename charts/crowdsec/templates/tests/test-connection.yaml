{{- /* `helm test`: checks that every deployed component answers through its Service */ -}}
{{- $checks := list }}
{{- if .Values.lapi.enabled }}
{{- $checks = append $checks (dict "component" "lapi" "url" (printf "%s/health" (include "crowdsec.lapiURL" .))) }}
{{- end }}
{{- if .Values.agent.enabled }}
{{- $checks = append $checks (dict "component" "agent" "url" (printf "http://%s:6060/metrics" (include "crowdsec.componentName" (list . "agent")))) }}
{{- end }}
{{- if .Values.appsec.enabled }}
{{- $checks = append $checks (dict "component" "appsec" "url" (printf "http://%s:6060/metrics" (include "crowdsec.componentName" (list . "appsec")))) }}
{{- end }}
{{- range $checks }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "crowdsec.componentName" (list $ (printf "test-%s" .component)) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- toYaml (merge (dict) $.Values.podLabels (include "crowdsec.labels" (list $ "test") | fromYaml)) | nindent 4 }}
  {{- include "crowdsec.annotations" (dict "ctx" $ "extra" (merge (dict "helm.sh/hook" "test" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded") $.Values.podAnnotations)) | nindent 2 }}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with $.Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: check
      image: {{ include "crowdsec.image" $ }}
      imagePullPolicy: {{ $.Values.image.pullPolicy }}
      {{- /* HTTP endpoints must answer 200; HTTPS (LAPI with TLS) only gets a connection check */}}
      command:
        - /bin/bash
        - -c
        - |
          set -eu
          {{- include "crowdsec.bashParseURL" . | nindent 10 }}
          check() {
            case "${URL}" in
              https://*)
                timeout 5 bash -c 'exec 3<>"/dev/tcp/$0/$1"' "${host}" "${port}" 2>/dev/null || return 1
                echo "${URL} accepts connections"
                ;;
              *)
                status=$(timeout 5 bash -c 'exec 3<>"/dev/tcp/$0/$1"
                  printf "GET %s HTTP/1.0\r\nHost: %s\r\n\r\n" "$2" "$0" >&3
                  head -n 1 <&3' "${host}" "${port}" "${path}" 2>/dev/null) || return 1
                echo "${URL}: ${status}"
                case "${status}" in "HTTP/1."?" 200"*) ;; *) return 1 ;; esac
                ;;
            esac
          }
          # `helm install --wait` does not wait for a single-node DaemonSet: give pods time to become ready
          deadline=$((SECONDS + 180))
          until check; do
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "${URL} did not answer within 3 minutes"
              exit 1
            fi
            echo "Waiting for ${URL}"
            sleep 5
          done
      env:
        - name: URL
          value: {{ .url | quote }}
      {{- include "crowdsec.helperContainer" $ | trim | nindent 6 }}
{{- end }}
