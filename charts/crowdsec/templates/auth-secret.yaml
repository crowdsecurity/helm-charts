{{- if and .Values.lapi.enabled (not .Values.auth.existingSecret) }}
{{- $name := include "crowdsec.authSecretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crowdsec.labels" (list . "lapi") | nindent 4 }}
  {{- include "crowdsec.annotations" (dict "ctx" .) | nindent 2 }}
type: Opaque
data:
  registrationToken: {{ get $existing "registrationToken" | default (randAlphaNum 48 | b64enc) }}
  csLapiSecret: {{ get $existing "csLapiSecret" | default (randAlphaNum 64 | b64enc) }}
  {{- with .Values.lapi.console.enrollKey }}
  enrollKey: {{ . | b64enc }}
  {{- end }}
{{- end }}
