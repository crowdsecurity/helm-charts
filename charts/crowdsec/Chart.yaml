apiVersion: v2
name: crowdsec
description: CrowdSec is an open-source, lightweight security engine that detects and responds to bad behaviours.
type: application
version: 2.0.0
appVersion: v1.8.1
kubeVersion: ">=1.27.0-0"
home: https://crowdsec.net
icon: https://raw.githubusercontent.com/crowdsecurity/crowdsec-docs/main/crowdsec-docs/static/img/crowdsec_logo.png
sources:
  - https://github.com/crowdsecurity/crowdsec
  - https://github.com/crowdsecurity/helm-charts
keywords:
  - crowdsec
  - security
  - waf
  - ids
maintainers:
  - name: CrowdSec
    url: https://crowdsec.net
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Breaking: the chart is rewritten and values are restructured; read the migration guide before upgrading from 1.x"
      links:
        - name: Migration guide
          url: https://github.com/crowdsecurity/helm-charts/blob/main/charts/crowdsec/MIGRATION.md
    - kind: changed
      description: "Breaking: LAPI requires an external PostgreSQL or MySQL database and runs as a stateless Deployment that can have several replicas"
    - kind: changed
      description: "Breaking: resources are renamed to <release>-crowdsec-<component> (e.g. the LAPI Service is crowdsec-lapi); update your bouncers' LAPI and AppSec URLs"
    - kind: changed
      description: "Breaking: labels follow app.kubernetes.io/* conventions, so workloads are recreated on upgrade"
    - kind: changed
      description: Configuration files are set per component with <component>.files and <component>.config
    - kind: changed
      description: The upstream CrowdSec image is used as-is, without the custom entrypoint script
    - kind: changed
      description: With TLS enabled, agents and AppSec always authenticate to LAPI with client certificates
    - kind: added
      description: Strict values.schema.json validation that names any unknown or 1.x key
    - kind: added
      description: agent.podLogs to read pod logs, and agent.hub / appsec.hub to install hub items
    - kind: removed
      description: SQLite support, the persistent volumes, container_runtime, secrets.username/password and PodMonitor support
    - kind: removed
      description: Out-of-the-box Docker JSON log support (manual configuration is documented in the migration guide)
