# yaml-language-server: $schema=./values.schema.json

## @section Common
## @param nameOverride Override the chart name used in resource names
nameOverride: ""
## @param fullnameOverride Override the full resource name prefix (defaults to <release>-<chart>, or <release> if it already contains the chart name)
fullnameOverride: ""
## @param commonLabels Labels added to every resource created by the chart, including pods and Secrets created by cert-manager or the registration Job
commonLabels: {}
## @param commonAnnotations Annotations added to every resource created by the chart (not the pods of Deployments, DaemonSets and Jobs: use `podAnnotations`)
commonAnnotations: {}

## @param imageRegistry Registry prepended to every image that has no `registry` of its own (e.g. a mirror)
imageRegistry: ""

## @param image.registry CrowdSec image registry (defaults to `imageRegistry`)
## @param image.repository CrowdSec image repository (used by every component)
## @param image.tag CrowdSec image tag (defaults to the chart appVersion)
## @param image.digest CrowdSec image digest (e.g. `sha256:...`), appended to the tag
## @param image.pullPolicy Image pull policy
image:
  registry: ""
  repository: crowdsecurity/crowdsec
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

## @param imagePullSecrets Image pull secrets for every pod (list of `{name: ...}`)
imagePullSecrets: []

## @param podLabels Labels added to every pod (merged with the component `podLabels`)
podLabels: {}
## @param podAnnotations Annotations added to every pod (merged with the component `podAnnotations`)
podAnnotations: {}

## @param helperContainers.securityContext [object] Security context of the helper containers: `wait-for-lapi` and LAPI `local-machine` init containers, Central API registration Job, `helm test` pods
## @param helperContainers.resources [object] Resources of the helper containers
helperContainers:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

## @param extraObjects Extra manifests deployed with the release (objects or strings, rendered with `tpl`), e.g. an ExternalSecret for the database password
extraObjects: []

## @section Authentication
## Shared secret material between LAPI, agents and AppSec.
## When `existingSecret` is empty, the chart generates a Secret and reuses its values across upgrades.
## Set `existingSecret` when deploying with GitOps tools that render templates without cluster access (ArgoCD, `helm template`),
## otherwise the values are regenerated on every render.
## @param auth.existingSecret Name of an existing Secret with keys `registrationToken` (>= 32 chars), `csLapiSecret` (>= 64 chars) and optionally `enrollKey`. With an external LAPI, only `registrationToken` is needed
auth:
  existingSecret: ""

## @section TLS
## When enabled, LAPI serves HTTPS and agents/AppSec authenticate with client certificates (OU `agent-ou`).
## A bouncer client certificate (OU `bouncer-ou`) is also issued for in-cluster bouncers.
## @param tls.enabled Enable TLS for LAPI and certificate authentication for agents and AppSec
## @param tls.certManager.enabled Issue certificates with cert-manager (otherwise provide `tls.existingSecrets`)
## @param tls.certManager.issuerRef Existing issuer (`{name, kind}`) to sign certificates. Empty creates a self-signed CA for the release
## @param tls.certManager.duration Certificate validity duration
## @param tls.certManager.renewBefore Renew certificates this long before they expire
## @param tls.certManager.secretTemplate Labels and annotations added to the generated Secrets (e.g. for reflector/replicator)
## @param tls.existingSecrets.lapi Secret holding the LAPI server certificate (`tls.crt`, `tls.key`, `ca.crt`), used when cert-manager is disabled
## @param tls.existingSecrets.agent Secret holding the agent client certificate (`tls.crt`, `tls.key`, `ca.crt`), used when cert-manager is disabled
tls:
  enabled: false
  certManager:
    enabled: true
    issuerRef: {}
    duration: 2160h
    renewBefore: 720h
    secretTemplate: {}
  existingSecrets:
    lapi: ""
    agent: ""

## @section LAPI
lapi:
  ## @param lapi.enabled Deploy the Local API. When disabled, agents and AppSec connect to `lapi.externalURL`
  enabled: true
  ## @param lapi.externalURL URL of an existing LAPI, used only when `lapi.enabled` is false
  externalURL: ""
  ## @param lapi.replicas Number of LAPI replicas
  replicas: 1

  ## LAPI requires an external PostgreSQL or MySQL database. Every replica uses it, so the LAPI pods are stateless.
  ## @param lapi.database.type Database type (`postgresql` or `mysql`)
  ## @param lapi.database.host Database host
  ## @param lapi.database.port [nullable] Database port (defaults to 5432 for PostgreSQL, 3306 for MySQL)
  ## @param lapi.database.name Database name
  ## @param lapi.database.user Database user
  ## @param lapi.database.sslMode PostgreSQL `sslmode` (e.g. `disable`, `require`, `verify-full`)
  ## @param lapi.database.existingSecret Name of the Secret holding the database password
  ## @param lapi.database.passwordKey Key of the password in `existingSecret`
  database:
    type: postgresql
    host: ""
    port: null
    name: crowdsec
    user: crowdsec
    sslMode: ""
    existingSecret: ""
    passwordKey: password

  ## @param lapi.onlineAPI.enabled Connect to the CrowdSec Central API (community blocklist, console)
  ## @param lapi.onlineAPI.existingSecret Secret with an `online_api_credentials.yaml` key. When empty, a pre-install/pre-upgrade Job registers the instance and creates the Secret
  ## @param lapi.onlineAPI.registrationJob.image.registry Registry of the `kubectl` image (defaults to `imageRegistry`)
  ## @param lapi.onlineAPI.registrationJob.image.repository Image providing `kubectl` for the registration Job
  ## @param lapi.onlineAPI.registrationJob.image.tag Tag of the `kubectl` image
  ## @param lapi.onlineAPI.registrationJob.image.digest Digest of the `kubectl` image
  ## @param lapi.onlineAPI.registrationJob.image.pullPolicy Pull policy of the `kubectl` image
  onlineAPI:
    enabled: true
    existingSecret: ""
    registrationJob:
      image:
        registry: ""
        repository: alpine/kubectl
        tag: "1.36.4"
        digest: ""
        pullPolicy: IfNotPresent

  ## @param lapi.console.enrollKey CrowdSec Console enrollment key (stored in the auth Secret; or set `enrollKey` in `auth.existingSecret`)
  ## @param lapi.console.instanceName Name of the instance in the Console
  ## @param lapi.console.tags Tags of the instance in the Console
  console:
    enrollKey: ""
    instanceName: ""
    tags: []

  ## @param lapi.config Settings merged into the LAPI `config.yaml.local`, on top of the chart-managed settings
  config: {}
    # api:
    #   server:
    #     auto_registration:
    #       allowed_ranges: ["10.42.0.0/16"]
  ## @param lapi.files Extra files written under `/etc/crowdsec` (key: relative path, value: content), e.g. `profiles.yaml`, `notifications/slack.yaml`, `console.yaml`
  files: {}
    # notifications/slack.yaml: |
    #   type: slack
    #   name: slack_default
    #   webhook: ${SLACK_WEBHOOK}

  ## @param lapi.env Extra environment variables for the LAPI container
  env: []
  ## @param lapi.envFrom Extra `envFrom` sources for the LAPI container
  envFrom: []

  ## @param lapi.service.type LAPI Service type
  ## @param lapi.service.port LAPI Service port
  ## @param lapi.service.annotations LAPI Service annotations
  ## @param lapi.service.labels LAPI Service labels
  ## @param lapi.service.internalTrafficPolicy Service `internalTrafficPolicy` (`Cluster` or `Local`)
  ## @param lapi.service.trafficDistribution Service `trafficDistribution` (e.g. `PreferClose`, Kubernetes >= 1.31)
  ## @param lapi.service.nodePorts Fixed node ports by port name (e.g. `{lapi: 30080}`), for `NodePort`/`LoadBalancer` Services
  ## @param lapi.service.extraSpec Extra Service spec fields, e.g. `externalTrafficPolicy: Local` (keeps client IPs), `loadBalancerIP`, `loadBalancerClass`, `loadBalancerSourceRanges`
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
    labels: {}
    internalTrafficPolicy: ""
    trafficDistribution: ""
    nodePorts: {}
    extraSpec: {}

  ## @param lapi.ingress.enabled Expose LAPI through an Ingress
  ## @param lapi.ingress.className IngressClass name
  ## @param lapi.ingress.annotations Ingress annotations
  ## @param lapi.ingress.host Ingress hostname
  ## @param lapi.ingress.tls Ingress TLS configuration
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    tls: []

  ## @param lapi.metrics.serviceMonitor.enabled Create a Prometheus Operator ServiceMonitor
  ## @param lapi.metrics.serviceMonitor.labels Extra ServiceMonitor labels
  ## @param lapi.metrics.serviceMonitor.interval Scrape interval
  ## @param lapi.metrics.serviceMonitor.scrapeTimeout Scrape timeout
  ## @param lapi.metrics.serviceMonitor.honorLabels Keep the scraped labels on conflicts
  ## @param lapi.metrics.serviceMonitor.relabelings Relabelings applied before scraping, after the default one setting `machine` to the node name
  ## @param lapi.metrics.serviceMonitor.metricRelabelings Relabelings applied to the scraped samples
  metrics:
    serviceMonitor:
      enabled: false
      labels: {}
      interval: ""
      scrapeTimeout: ""
      honorLabels: false
      relabelings: []
      metricRelabelings: []

  ## @param lapi.podDisruptionBudget.enabled Create a PodDisruptionBudget
  ## @param lapi.podDisruptionBudget.maxUnavailable Maximum unavailable pods
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1

  ## @param lapi.strategy [object] Deployment strategy
  strategy:
    type: RollingUpdate
  ## @param lapi.resources [object] Container resources
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  ## @param lapi.livenessProbe [object] Liveness probe (the scheme is switched to HTTPS when TLS is enabled)
  livenessProbe:
    httpGet:
      path: /health
      port: lapi
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  ## @param lapi.readinessProbe [object] Readiness probe (the scheme is switched to HTTPS when TLS is enabled)
  readinessProbe:
    httpGet:
      path: /health
      port: lapi
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  ## @param lapi.startupProbe [object] Startup probe (the scheme is switched to HTTPS when TLS is enabled)
  startupProbe:
    httpGet:
      path: /health
      port: lapi
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  ## @param lapi.annotations Deployment annotations
  annotations: {}
  ## @param lapi.podLabels Pod labels
  podLabels: {}
  ## @param lapi.podAnnotations Pod annotations
  podAnnotations: {}
  ## @param lapi.podSecurityContext [object] Pod security context
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  ## @param lapi.securityContext [object] Container security context
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
  ## @param lapi.serviceAccountName Service account of the pods (none of the pods need Kubernetes API access)
  serviceAccountName: ""
  ## @param lapi.priorityClassName Priority class name
  priorityClassName: ""
  ## @param lapi.nodeSelector Node selector
  nodeSelector: {}
  ## @param lapi.tolerations Tolerations
  tolerations: []
  ## @param lapi.affinity Affinity
  affinity: {}
  ## @param lapi.topologySpreadConstraints Topology spread constraints
  topologySpreadConstraints: []
  ## @param lapi.dnsConfig Pod DNS configuration
  dnsConfig: {}
  ## @param lapi.extraInitContainers Extra init containers
  extraInitContainers: []
  ## @param lapi.extraVolumes Extra volumes
  extraVolumes: []
  ## @param lapi.extraVolumeMounts Extra volume mounts for the LAPI container
  extraVolumeMounts: []
  ## @param lapi.extraContainers Extra containers (sidecars)
  extraContainers: []
  ## @param lapi.lifecycle Lifecycle hooks of the LAPI container
  lifecycle: {}
  ## @param lapi.terminationGracePeriodSeconds [nullable] Pod termination grace period (Kubernetes default when null)
  terminationGracePeriodSeconds: null
  ## @param lapi.hostAliases Pod host aliases
  hostAliases: []
  ## @param lapi.runtimeClassName Pod runtime class
  runtimeClassName: ""
  ## @param lapi.hostUsers [nullable] Set to `false` to run the pods in a user namespace (Kubernetes >= 1.33 with a supporting runtime)
  hostUsers: null
  ## @param lapi.dnsPolicy Pod DNS policy
  dnsPolicy: ""
  ## @param lapi.enableServiceLinks Inject environment variables for the Services of the namespace
  enableServiceLinks: false
  ## @param lapi.revisionHistoryLimit [nullable] Number of old ReplicaSets/revisions to keep (Kubernetes default when null)
  revisionHistoryLimit: null
  ## @param lapi.minReadySeconds Seconds a new pod must be ready before being considered available
  minReadySeconds: 0

## @section Agent
agent:
  ## @param agent.enabled Deploy the log processing agent
  enabled: true
  ## @param agent.kind Workload kind: `DaemonSet` (read pod logs on every node) or `Deployment` (network datasources)
  kind: DaemonSet
  ## @param agent.replicas Number of replicas when `kind` is `Deployment`
  replicas: 1

  ## Hub items installed at startup (https://app.crowdsec.net/hub).
  ## @param agent.hub.collections Collections to install
  ## @param agent.hub.parsers Parsers to install
  ## @param agent.hub.scenarios Scenarios to install
  ## @param agent.hub.postoverflows Postoverflows to install
  ## @param agent.hub.contexts Contexts to install
  hub:
    collections: []
    parsers: []
    scenarios: []
    postoverflows: []
    contexts: []

  ## Kubernetes pod logs to process. Each entry reads /var/log/containers/<pod>_<namespace>_*.log from the node.
  ## @param agent.podLogs List of `{namespace, pod, program}` (`pod` accepts globs, `program` selects the parsers)
  podLogs: []
    # - namespace: ingress-nginx
    #   pod: ingress-nginx-controller-*
    #   program: nginx
  ## @param agent.acquisition Additional raw acquisition entries (https://docs.crowdsec.net/docs/next/log_processor/data_sources/intro)
  acquisition: []
    # - source: syslog
    #   listen_addr: 0.0.0.0
    #   listen_port: 4242
    #   labels:
    #     type: syslog

  ## @param agent.config Settings merged into the agent `config.yaml.local`, on top of the chart-managed settings
  config: {}
  ## @param agent.files Extra files written under `/etc/crowdsec` (key: relative path, value: content), e.g. `parsers/s01-parse/my-parser.yaml`, `scenarios/my-scenario.yaml`, `simulation.yaml`
  files: {}
    # scenarios/my-scenario.yaml: |
    #   type: leaky
    #   name: me/my-scenario
    #   ...

  ## @param agent.env Extra environment variables for the agent container
  env: []
  ## @param agent.envFrom Extra `envFrom` sources for the agent container
  envFrom: []
  ## @param agent.extraPorts Extra ports (`{name, port, protocol}`) exposed on the container and the agent Service, e.g. for network datasources
  extraPorts: []

  ## @param agent.service.type Agent Service type
  ## @param agent.service.annotations Agent Service annotations
  ## @param agent.service.labels Agent Service labels
  ## @param agent.service.internalTrafficPolicy Service `internalTrafficPolicy` (`Cluster` or `Local`)
  ## @param agent.service.trafficDistribution Service `trafficDistribution` (e.g. `PreferClose`, Kubernetes >= 1.31)
  ## @param agent.service.nodePorts Fixed node ports by port name (e.g. `{syslog: 30514}` for an `extraPorts` entry), for `NodePort`/`LoadBalancer` Services
  ## @param agent.service.extraSpec Extra Service spec fields, e.g. `externalTrafficPolicy: Local` (keeps client IPs), `loadBalancerIP`, `loadBalancerClass`, `loadBalancerSourceRanges`
  service:
    type: ClusterIP
    annotations: {}
    labels: {}
    internalTrafficPolicy: ""
    trafficDistribution: ""
    nodePorts: {}
    extraSpec: {}

  ## @param agent.metrics.serviceMonitor.enabled Create a Prometheus Operator ServiceMonitor
  ## @param agent.metrics.serviceMonitor.labels Extra ServiceMonitor labels
  ## @param agent.metrics.serviceMonitor.interval Scrape interval
  ## @param agent.metrics.serviceMonitor.scrapeTimeout Scrape timeout
  ## @param agent.metrics.serviceMonitor.honorLabels Keep the scraped labels on conflicts
  ## @param agent.metrics.serviceMonitor.relabelings Relabelings applied before scraping, after the default one setting `machine` to the node name
  ## @param agent.metrics.serviceMonitor.metricRelabelings Relabelings applied to the scraped samples
  metrics:
    serviceMonitor:
      enabled: false
      labels: {}
      interval: ""
      scrapeTimeout: ""
      honorLabels: false
      relabelings: []
      metricRelabelings: []

  ## @param agent.updateStrategy DaemonSet `updateStrategy`, or Deployment `strategy`
  updateStrategy: {}
  ## @param agent.resources [object] Container resources
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  ## @param agent.livenessProbe [object] Liveness probe
  livenessProbe:
    httpGet:
      path: /metrics
      port: metrics
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  ## @param agent.readinessProbe [object] Readiness probe
  readinessProbe:
    httpGet:
      path: /metrics
      port: metrics
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  ## @param agent.startupProbe [object] Startup probe
  startupProbe:
    httpGet:
      path: /metrics
      port: metrics
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  ## @param agent.annotations Workload annotations
  annotations: {}
  ## @param agent.podLabels Pod labels
  podLabels: {}
  ## @param agent.podAnnotations Pod annotations
  podAnnotations: {}
  ## @param agent.podSecurityContext [object] Pod security context
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  ## @param agent.securityContext [object] Container security context
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
  ## @param agent.serviceAccountName Service account of the pods (e.g. for cloud datasources using workload identity)
  serviceAccountName: ""
  ## @param agent.priorityClassName Priority class name
  priorityClassName: ""
  ## @param agent.nodeSelector Node selector
  nodeSelector: {}
  ## @param agent.tolerations Tolerations
  tolerations: []
  ## @param agent.affinity Affinity
  affinity: {}
  ## @param agent.topologySpreadConstraints Topology spread constraints
  topologySpreadConstraints: []
  ## @param agent.dnsConfig Pod DNS configuration
  dnsConfig: {}
  ## @param agent.extraInitContainers Extra init containers
  extraInitContainers: []
  ## @param agent.extraVolumes Extra volumes
  extraVolumes: []
  ## @param agent.extraVolumeMounts Extra volume mounts for the agent container
  extraVolumeMounts: []
  ## @param agent.extraContainers Extra containers (sidecars)
  extraContainers: []
  ## @param agent.lifecycle Lifecycle hooks of the agent container
  lifecycle: {}
  ## @param agent.terminationGracePeriodSeconds [nullable] Pod termination grace period (Kubernetes default when null)
  terminationGracePeriodSeconds: null
  ## @param agent.hostAliases Pod host aliases
  hostAliases: []
  ## @param agent.runtimeClassName Pod runtime class
  runtimeClassName: ""
  ## @param agent.hostUsers [nullable] Set to `false` to run the pods in a user namespace (Kubernetes >= 1.33 with a supporting runtime; reading host logs may then fail)
  hostUsers: null
  ## @param agent.dnsPolicy Pod DNS policy
  dnsPolicy: ""
  ## @param agent.enableServiceLinks Inject environment variables for the Services of the namespace
  enableServiceLinks: false
  ## @param agent.revisionHistoryLimit [nullable] Number of old ReplicaSets/revisions to keep (Kubernetes default when null)
  revisionHistoryLimit: null
  ## @param agent.minReadySeconds Seconds a new pod must be ready before being considered available
  minReadySeconds: 0

## @section AppSec
appsec:
  ## @param appsec.enabled Deploy the AppSec component (WAF)
  enabled: false
  ## @param appsec.kind Workload kind: `Deployment`, or `DaemonSet` to run AppSec next to node-local ingress controllers (see `service.internalTrafficPolicy`)
  kind: Deployment
  ## @param appsec.replicas Number of replicas when `kind` is `Deployment`
  replicas: 1
  ## @param appsec.port AppSec listener port exposed by the container and the Service (must match `listen_addr` in `acquisition`)
  port: 7422

  ## @param appsec.hub.collections Collections to install
  ## @param appsec.hub.scenarios Scenarios to install
  ## @param appsec.hub.postoverflows Postoverflows to install
  ## @param appsec.hub.appsecConfigs AppSec configs to install
  ## @param appsec.hub.appsecRules AppSec rules to install
  hub:
    collections:
      - crowdsecurity/appsec-virtual-patching
      - crowdsecurity/appsec-generic-rules
    scenarios: []
    postoverflows: []
    appsecConfigs: []
    appsecRules: []

  ## @param appsec.acquisition [array] AppSec acquisition entries (https://docs.crowdsec.net/docs/next/log_processor/data_sources/appsec)
  acquisition:
    - source: appsec
      listen_addr: 0.0.0.0:7422
      path: /
      appsec_config: crowdsecurity/appsec-default
      labels:
        type: appsec

  ## @param appsec.config Settings merged into the AppSec `config.yaml.local`, on top of the chart-managed settings
  config: {}
  ## @param appsec.files Extra files written under `/etc/crowdsec` (key: relative path, value: content), e.g. `appsec-configs/my-config.yaml`, `appsec-rules/my-rule.yaml`
  files: {}

  ## @param appsec.env Extra environment variables for the AppSec container
  env: []
  ## @param appsec.envFrom Extra `envFrom` sources for the AppSec container
  envFrom: []
  ## @param appsec.extraPorts Extra ports (`{name, port, protocol}`) exposed on the container and the AppSec Service, e.g. additional appsec listeners
  extraPorts: []

  ## @param appsec.service.type AppSec Service type
  ## @param appsec.service.annotations AppSec Service annotations
  ## @param appsec.service.labels AppSec Service labels
  ## @param appsec.service.internalTrafficPolicy Service `internalTrafficPolicy` (`Cluster` or `Local`)
  ## @param appsec.service.trafficDistribution Service `trafficDistribution` (e.g. `PreferClose`, Kubernetes >= 1.31)
  ## @param appsec.service.nodePorts Fixed node ports by port name (e.g. `{appsec: 30080}`), for `NodePort`/`LoadBalancer` Services
  ## @param appsec.service.extraSpec Extra Service spec fields, e.g. `externalTrafficPolicy: Local` (keeps client IPs), `loadBalancerIP`, `loadBalancerClass`, `loadBalancerSourceRanges`
  service:
    type: ClusterIP
    annotations: {}
    labels: {}
    internalTrafficPolicy: ""
    trafficDistribution: ""
    nodePorts: {}
    extraSpec: {}

  ## @param appsec.metrics.serviceMonitor.enabled Create a Prometheus Operator ServiceMonitor
  ## @param appsec.metrics.serviceMonitor.labels Extra ServiceMonitor labels
  ## @param appsec.metrics.serviceMonitor.interval Scrape interval
  ## @param appsec.metrics.serviceMonitor.scrapeTimeout Scrape timeout
  ## @param appsec.metrics.serviceMonitor.honorLabels Keep the scraped labels on conflicts
  ## @param appsec.metrics.serviceMonitor.relabelings Relabelings applied before scraping, after the default one setting `machine` to the node name
  ## @param appsec.metrics.serviceMonitor.metricRelabelings Relabelings applied to the scraped samples
  metrics:
    serviceMonitor:
      enabled: false
      labels: {}
      interval: ""
      scrapeTimeout: ""
      honorLabels: false
      relabelings: []
      metricRelabelings: []

  ## @param appsec.podDisruptionBudget.enabled Create a PodDisruptionBudget
  ## @param appsec.podDisruptionBudget.maxUnavailable Maximum unavailable pods
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1

  ## @param appsec.updateStrategy Deployment `strategy`, or DaemonSet `updateStrategy`
  updateStrategy: {}
  ## @param appsec.resources [object] Container resources
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  ## @param appsec.livenessProbe [object] Liveness probe
  livenessProbe:
    httpGet:
      path: /metrics
      port: metrics
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  ## @param appsec.readinessProbe [object] Readiness probe
  readinessProbe:
    httpGet:
      path: /metrics
      port: metrics
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  ## @param appsec.startupProbe [object] Startup probe
  startupProbe:
    httpGet:
      path: /metrics
      port: metrics
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  ## @param appsec.annotations Deployment annotations
  annotations: {}
  ## @param appsec.podLabels Pod labels
  podLabels: {}
  ## @param appsec.podAnnotations Pod annotations
  podAnnotations: {}
  ## @param appsec.podSecurityContext [object] Pod security context
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  ## @param appsec.securityContext [object] Container security context
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
  ## @param appsec.serviceAccountName Service account of the pods
  serviceAccountName: ""
  ## @param appsec.priorityClassName Priority class name
  priorityClassName: ""
  ## @param appsec.nodeSelector Node selector
  nodeSelector: {}
  ## @param appsec.tolerations Tolerations
  tolerations: []
  ## @param appsec.affinity Affinity
  affinity: {}
  ## @param appsec.topologySpreadConstraints Topology spread constraints
  topologySpreadConstraints: []
  ## @param appsec.dnsConfig Pod DNS configuration
  dnsConfig: {}
  ## @param appsec.extraInitContainers Extra init containers
  extraInitContainers: []
  ## @param appsec.extraVolumes Extra volumes
  extraVolumes: []
  ## @param appsec.extraVolumeMounts Extra volume mounts for the AppSec container
  extraVolumeMounts: []
  ## @param appsec.extraContainers Extra containers (sidecars)
  extraContainers: []
  ## @param appsec.lifecycle Lifecycle hooks of the AppSec container
  lifecycle: {}
  ## @param appsec.terminationGracePeriodSeconds [nullable] Pod termination grace period (Kubernetes default when null)
  terminationGracePeriodSeconds: null
  ## @param appsec.hostAliases Pod host aliases
  hostAliases: []
