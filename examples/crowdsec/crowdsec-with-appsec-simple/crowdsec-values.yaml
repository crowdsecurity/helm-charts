lapi:
  database:
    host: postgres.databases.svc
    existingSecret: crowdsec-db
  # Pre-register the ingress-nginx bouncer with a known key (read by the image entrypoint)
  env:
    - name: BOUNCER_KEY_nginx
      valueFrom:
        secretKeyRef:
          name: crowdsec-bouncer-keys
          key: nginx
agent:
  hub:
    collections:
      - crowdsecurity/nginx
  podLogs:
    - namespace: ingress-nginx
      pod: ingress-nginx-controller-*
      program: nginx
appsec:
  enabled: true
  hub:
    collections:
      - crowdsecurity/appsec-wordpress
      - crowdsecurity/appsec-crs
  acquisition:
    - source: appsec
      listen_addr: 0.0.0.0:7422
      path: /
      appsec_config: crowdsecurity/crs-vpatch
      labels:
        type: appsec
  files:
    appsec-configs/mycustom-appsec-config.yaml: |
      name: crowdsecurity/crs-vpatch
      default_remediation: ban
      inband_rules:
        - crowdsecurity/base-config
        - crowdsecurity/vpatch-*
