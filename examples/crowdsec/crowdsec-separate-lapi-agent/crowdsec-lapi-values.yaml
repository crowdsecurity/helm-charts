# LAPI only, in its own release/namespace. Agents from other releases connect to it.
#
# Prerequisites in the crowdsec-lapi namespace:
#   kubectl -n crowdsec-lapi create secret generic crowdsec-db --from-literal=password=<db password>
#   kubectl -n crowdsec-lapi create secret generic crowdsec-auth \
#     --from-literal=registrationToken=$(openssl rand -hex 24) \
#     --from-literal=csLapiSecret=$(openssl rand -hex 32)
auth:
  existingSecret: crowdsec-auth
lapi:
  database:
    host: postgres.databases.svc
    existingSecret: crowdsec-db
  # console:
  #   instanceName: k8s_cluster
  #   tags: [k8s, linux]
agent:
  enabled: false
