# Agents only, connecting to the LAPI release installed in the crowdsec-lapi namespace.
#
# The agent needs the registration token of that LAPI: copy the crowdsec-auth Secret to this namespace
# (only the registrationToken key is used here).
auth:
  existingSecret: crowdsec-auth
lapi:
  enabled: false
  externalURL: http://crowdsec-lapi.crowdsec-lapi.svc:8080
agent:
  hub:
    collections:
      - crowdsecurity/nginx
  podLogs:
    - namespace: ingress-nginx
      pod: ingress-nginx-controller-*
      program: nginx
