### Agent running as a Deployment with the HTTP datasource (basic auth), and LAPI.
### See https://docs.crowdsec.net/docs/next/log_processor/data_sources/http for the datasource options.
lapi:
  database:
    host: postgres.databases.svc
    existingSecret: crowdsec-db
agent:
  kind: Deployment
  replicas: 1
  hub:
    collections:
      - crowdsecurity/nginx
  # Exposed on the container and on the agent Service (crowdsec-agent:8080)
  extraPorts:
    - name: http-datasource
      port: 8080
  # For production use, make sure to use a secure username and password
  acquisition:
    - source: http
      listen_addr: 0.0.0.0:8080
      path: /test
      auth_type: basic_auth
      basic_auth:
        username: test
        password: test
      labels:
        type: nginx
