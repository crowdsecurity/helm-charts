name: Lint and Test Crowdsec Chart

on:
  pull_request:
    branches:
      - main
    paths:
      - 'charts/crowdsec/**'
      - 'hack/ci/**'
      - 'hack/crowdsec-values-schema.py'
      - '.github/workflows/lint-test.yaml'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Check values.schema.json is up to date
        run: |
          python3 hack/crowdsec-values-schema.py > /tmp/values.schema.json
          diff -u charts/crowdsec/values.schema.json /tmp/values.schema.json

      - name: Lint
        run: |
          for values in charts/crowdsec/ci/*-values.yaml; do
            helm lint --strict charts/crowdsec -f "$values"
          done

      - name: Unit tests
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.7.2
          helm unittest charts/crowdsec

  install:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0

      - name: Install test dependencies (cert-manager, PostgreSQL)
        run: |
          helm install cert-manager cert-manager --repo https://charts.jetstack.io \
            --namespace cert-manager --create-namespace --set crds.enabled=true --wait
          kubectl apply -f hack/ci/postgres.yaml
          kubectl -n crowdsec-ci-db rollout status deploy/postgres --timeout=180s
          kubectl create namespace crowdsec
          kubectl -n crowdsec create secret generic crowdsec-db --from-literal=password=crowdsec-ci

      # Installs the chart once per charts/crowdsec/ci/*-values.yaml and runs `helm test`
      - name: Run chart-testing (install)
        run: ct install --charts charts/crowdsec --namespace crowdsec
